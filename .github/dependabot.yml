---
version: 2
updates:

  # Track PSR new releases automatically
  - package-ecosystem: pip
    directory: src/
    schedule:
      interval: daily
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
      - dependabot
    rebase-strategy: auto
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 3
      exclude:
        - python-semantic-release

  # Maintain dependencies for Docker (ie our GitHub Action)
  - package-ecosystem: docker
    directory: src/
    schedule:
      interval: monthly
    labels:
      - dependencies
      - dependabot
    rebase-strategy: auto
    commit-message:
      prefix: build
      include: scope # (deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "18:00"
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - dependabot
    rebase-strategy: auto
    cooldown:
      default-days: 3
      exclude:
        - python-semantic-release/python-semantic-release
    groups:
      github-actions:
        patterns:
        - "*"
